spring:
  application:
    name: domain-core-modelhub
server:
  port: ${SERVER_PORT:18123}
firefly:
  eda:
    enabled: false
  stepevents:
    enabled: false
  modelhub:
    record:
      adapter: sandbox
      core-base-url: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
